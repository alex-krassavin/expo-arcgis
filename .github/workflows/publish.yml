name: Publish

# Publishes packages of the monorepo (packages/<name>) to npm, with provenance. Run it by hand
# (Actions → Publish → Run workflow) from main and tick the packages to publish — workflow_dispatch
# has no multi-select, so each package is a checkbox named after its directory. They go out one at
# a time, the core (expo-arcgis) first. Each publishes the version in its package.json, so bump it
# and commit first.
#
# After npm, each package gets its GitHub Release, tagged `v<version>` for the core and
# `<name>@<version>` for the others, with the version's CHANGELOG section as notes. A draft already
# prepared for that tag is published as it is.
#
# A prerelease version (with a `-`, e.g. 0.8.0-beta.1) goes to the `next` dist-tag, any other to
# `latest`. A dry run builds, validates and packs, then stops.
on:
  workflow_dispatch:
    inputs:
      # One checkbox per package, named after its directory under packages/.
      expo-arcgis:
        description: expo-arcgis (the core)
        type: boolean
        default: false
      expo-arcgis-toolkit:
        description: expo-arcgis-toolkit
        type: boolean
        default: false
      dry-run:
        description: Dry run — build, validate and pack, but don't publish
        type: boolean
        default: false

permissions:
  contents: read

# One publish at a time; never cancel one halfway.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    name: Pick the packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
    steps:
      - uses: actions/checkout@v7

      # Every ticked input but dry-run names a package directory. The core goes first: the others
      # are built on it.
      - name: Pick the ticked packages
        id: pick
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          node -e '
            const fs = require("fs");
            const inputs = JSON.parse(process.env.INPUTS);
            const picked = Object.keys(inputs)
              .filter((key) => key !== "dry-run" && (inputs[key] === true || inputs[key] === "true"))
              .sort((a, b) => (a === "expo-arcgis" ? -1 : b === "expo-arcgis" ? 1 : a.localeCompare(b)));
            if (picked.length === 0) {
              console.log("::error::Tick at least one package to publish.");
              process.exit(1);
            }
            for (const name of picked) {
              if (!fs.existsSync(`packages/${name}/package.json`)) {
                console.log(`::error::There is no package ${name} in packages/.`);
                process.exit(1);
              }
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `packages=${JSON.stringify(picked)}\n`);
            console.log(`In order: ${picked.join(", ")}`);
          '

  publish:
    needs: plan
    name: Publish ${{ matrix.package }}${{ inputs.dry-run && ' (dry run)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      # One at a time, in the planned order, and stop at the first failure: a package built on
      # the core shouldn't go out when the core didn't.
      max-parallel: 1
      fail-fast: true
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    permissions:
      contents: write # the GitHub Release and its tag
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Which version, and whether it may go out: only from main, never a private package, never
      # a version npm already has. A dry run only warns about the last two, so it can check any
      # package's build and tarball. Values reach the script through env.
      - name: Resolve the package
        id: target
        env:
          PACKAGE: ${{ matrix.package }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          dir="packages/$PACKAGE"
          name=$(node -p "require('./$dir/package.json').name")
          version=$(node -p "require('./$dir/package.json').version")
          private=$(node -p "Boolean(require('./$dir/package.json').private)")
          if [ "$name" != "$PACKAGE" ]; then
            echo "::error::$dir/package.json is named '$name', not '$PACKAGE'."
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish from main, not $GITHUB_REF (a dry run may use any branch)."
            exit 1
          fi
          blocked() {
            if [ "$DRY_RUN" = "true" ]; then echo "::warning::$1"; else echo "::error::$1"; exit 1; fi
          }
          if [ "$private" = "true" ]; then
            blocked "$name is private (\"private\": true in $dir/package.json): remove it to publish."
          fi
          if npm view "$name@$version" version > /dev/null 2>&1; then
            blocked "$name@$version is already on npm. Bump the version in $dir/package.json first."
          fi
          case "$version" in
            *-*) dist_tag="next" ;;
            *) dist_tag="latest" ;;
          esac
          if [ "$name" = "expo-arcgis" ]; then tag="v$version"; else tag="$name@$version"; fi
          {
            echo "dir=$dir"
            echo "name=$name"
            echo "version=$version"
            echo "dist-tag=$dist_tag"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "$name@$version from $dir, to the '$dist_tag' dist-tag, released as $tag."

      # One install for the workspaces. The core's `prepare` builds its build/ and plugin/build,
      # which the packages built on it compile against when `npm publish` runs their `prepack`.
      - name: Install (builds the core)
        run: npm ci

      - name: Validate the package (publint, are-the-types-wrong)
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm run check:package --if-present

      # npm takes the README from the package's own directory. Make sure the tarball has one, and
      # that it is this package's (titled `# <name>`), not the repository's.
      - name: Check the README that ships
        working-directory: ${{ steps.target.outputs.dir }}
        env:
          NAME: ${{ steps.target.outputs.name }}
        run: |
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node -e '
            const fs = require("fs");
            const [pack] = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"));
            const files = pack.files.map((file) => file.path);
            if (!files.includes("README.md")) throw new Error("The tarball has no README.md");
            const title = fs.readFileSync("README.md", "utf8").split("\n")[0].trim();
            if (title !== "# " + process.env.NAME) {
              throw new Error(`README.md starts with "${title}", not "# ${process.env.NAME}"`);
            }
            console.log(`${pack.name}@${pack.version}: ${files.length} files, README "${title}"`);
          '

      # The tarball as `npm publish` would build it (prepare / prepack included), without the
      # registry: this works for a private package too.
      - name: Dry run
        if: ${{ inputs.dry-run }}
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm pack --dry-run

      # `npm publish` runs `prepare` / `prepack` again, so the tarball is built fresh from source.
      # --provenance ties the package to this workflow run (supply-chain attestation).
      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        working-directory: ${{ steps.target.outputs.dir }}
        env:
          DIST_TAG: ${{ steps.target.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: GitHub Release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ steps.target.outputs.dir }}
          NAME: ${{ steps.target.outputs.name }}
          VERSION: ${{ steps.target.outputs.version }}
          TAG: ${{ steps.target.outputs.tag }}
          DIST_TAG: ${{ steps.target.outputs.dist-tag }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null || echo none)
          if [ "$draft" = "true" ]; then
            gh release edit "$TAG" --draft=false
            echo "Published the prepared draft release $TAG."
          elif [ "$draft" = "false" ]; then
            echo "Release $TAG already exists."
          else
            # The version's CHANGELOG section: from `## <version>` to the next `## `.
            awk -v heading="## $VERSION" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found
            ' "$DIR/CHANGELOG.md" > "$RUNNER_TEMP/notes.md" 2> /dev/null || true
            [ -s "$RUNNER_TEMP/notes.md" ] || echo "See $DIR/CHANGELOG.md." > "$RUNNER_TEMP/notes.md"
            prerelease=""
            [ "$DIST_TAG" = "next" ] && prerelease="--prerelease"
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$NAME $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" $prerelease
            echo "Created release $TAG."
          fi
