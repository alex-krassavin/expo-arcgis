name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repository.
permissions:
  contents: read

jobs:
  validate:
    name: Typecheck · build · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` runs the `prepare` script, which builds build/ and plugin/build via tsc.
      - name: Install (builds build/ + plugin/build)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Not `npm test plugin`: that helper passes `--rootDir plugin` alongside a relative
      # `--config`, which mis-resolves to the root jest-expo preset and reports a false pass.
      - name: Config plugin tests
        run: npx jest --config plugin/jest.config.js

      # publint + are-the-types-wrong (the exact gate from `npm run check:package`).
      - name: Validate published package
        run: npm run check:package

      # Each platform compiles on its own, so a function or prop registered on only one of them
      # passes every build and fails at runtime on the other (how getCenter shipped in #19).
      - name: Native API parity (iOS ↔ Android)
        run: npm run check:parity

      # etc/expo-arcgis.api.md is the public API contract. Any change to it — even an additive one —
      # has to be committed on purpose, so it is visible in review; a removed or retyped prop
      # breaks every app that uses it.
      - name: Public API report
        run: |
          npm run check:api || {
            echo "::error file=etc/expo-arcgis.api.md::The public API changed. If that is intended, run 'npm run update:api' and commit etc/expo-arcgis.api.md — then make sure nothing existing was removed or retyped."
            exit 1
          }

  # The SDK gates. Each job packs the module, installs the tarball into a fresh
  # `blank-typescript@sdk-N` app and builds it there (internal/module_scripts/native-harness.js) —
  # so the published file list, the config plugin and the native sources all meet that SDK's own
  # template, React Native and expo-modules-core. TS compiling says nothing about whether the
  # Kotlin and Swift still build: every SDK bump and most feature PRs have broken one platform or
  # the other while `tsc` stayed green.
  #
  # The matrix is the support claim. Every Expo SDK listed here is one the README promises; a
  # version leaves the list only together with the `expo` peer range in package.json.
  android:
    name: Android · Expo SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk: [56, 57, 58]
    steps:
      - uses: actions/checkout@v7

      # React Native 0.88 (SDK 58) no longer supports Node 20.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # ArcGIS 300.1 ships Kotlin 2.3.20 metadata; the module reads it with
      # -Xskip-metadata-version-check. JDK 17 is what the Expo/AGP toolchain expects.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The ArcGIS AAR is ~190 MB. One cache per SDK, since each brings its own AGP/Kotlin/Gradle;
      # the key includes the pinned SDK version so it survives every build until the next bump.
      - name: Cache Gradle + ArcGIS AAR
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-sdk${{ matrix.sdk }}-${{ hashFiles('android/build.gradle', 'packages/*/android/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-sdk${{ matrix.sdk }}-

      # Dev dependencies are needed to pack: `npm pack` runs `prepare`, which compiles build/.
      - name: Install module
        run: npm ci

      - name: Compile module Kotlin in an Expo SDK ${{ matrix.sdk }} app
        run: >
          node internal/module_scripts/native-harness.js
          --sdk ${{ matrix.sdk }} --platform android --dir ${{ runner.temp }}/harness

  ios:
    name: iOS · Expo SDK ${{ matrix.sdk }}
    # macOS 26 ships Xcode 26.0.1–26.6 (26.6 default). ArcGIS 300.1 requires Xcode 26+ and an
    # iOS 18 deployment target, both satisfied by the default toolchain.
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk: [56, 57, 58]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The ArcGIS xcframework is ~336 MB unpacked and is fetched through SwiftPM. Resolve it into
      # a fixed directory (rather than inside DerivedData, whose path is randomised) so it can be
      # cached across runs and keyed on the pinned SDK version. The package is the same for every
      # Expo SDK, so the cache is shared.
      - name: Cache resolved Swift packages
        uses: actions/cache@v6
        with:
          path: ~/spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('ios/*.podspec', 'packages/*/ios/*.podspec') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install module
        run: npm ci

      # The ExpoArcgis scheme compiles the module's Swift against ArcGIS + ExpoModulesCore.
      # Simulator only: no signing identity is needed and none is available here.
      - name: Compile module Swift in an Expo SDK ${{ matrix.sdk }} app
        run: >
          node internal/module_scripts/native-harness.js
          --sdk ${{ matrix.sdk }} --platform ios --dir ${{ runner.temp }}/harness
          --spm-cache ~/spm-cache

  # The other half of the support claim: an app on that SDK must typecheck against our .d.ts
  # (each SDK brings its own React types) and bundle the library with its Metro.
  js:
    name: Types + bundle · Expo SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: [56, 57, 58]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install module
        run: npm ci

      - name: Typecheck + bundle an Expo SDK ${{ matrix.sdk }} app
        run: >
          node internal/module_scripts/native-harness.js
          --sdk ${{ matrix.sdk }} --platform js --dir ${{ runner.temp }}/harness
