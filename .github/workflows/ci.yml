name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck · build · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` runs the `prepare` script, which builds build/ and plugin/build via tsc.
      - name: Install (builds build/ + plugin/build)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Not `npm test plugin`: that helper passes `--rootDir plugin` alongside a relative
      # `--config`, which mis-resolves to the root jest-expo preset and reports a false pass.
      - name: Config plugin tests
        run: npx jest --config plugin/jest.config.js

      # publint + are-the-types-wrong (the exact gate from `npm run check:package`).
      - name: Validate published package
        run: npm run check:package

  # The native gates. TS compiling says nothing about whether the Kotlin and Swift behind it
  # still builds — every SDK bump and most feature PRs have broken one platform or the other
  # while `tsc` stayed green. `example/` is the harness: its android/ and ios/ directories are
  # generated by prebuild, so they are built here rather than committed.
  android:
    name: Android · compileDebugKotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ArcGIS 300.1 ships Kotlin 2.3.20 metadata; the module reads it with
      # -Xskip-metadata-version-check. JDK 17 is what the Expo/AGP toolchain expects.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ArcGIS AAR is ~190 MB. Key the cache on the pinned SDK version so it survives every
      # build until the next bump.
      - name: Cache Gradle + ArcGIS AAR
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/build.gradle', 'example/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install module
        run: npm ci

      # `npm install`, not `npm ci`: the example is a disposable harness whose package.json
      # carries caret ranges, so its lockfile drifts whenever an upstream Expo package ships.
      # `npm ci` would turn somebody else's release into a red build here. The module's own
      # lockfile is still installed strictly above — that one describes the published artifact.
      - name: Install example app
        working-directory: example
        run: npm install --no-audit --no-fund

      # Generates example/android from app.config.js + the config plugin — which is also the only
      # place the plugin's Gradle wiring (Esri Maven repo, minSdk/compileSdk) gets exercised.
      - name: Prebuild example (android)
        working-directory: example
        run: npx expo prebuild -p android --no-install

      - name: Compile module Kotlin
        working-directory: example/android
        run: ./gradlew :expo-arcgis:compileDebugKotlin --no-daemon

  ios:
    name: iOS · xcodebuild ExpoArcgis
    # macOS 26 ships Xcode 26.0.1–26.6 (26.6 default). ArcGIS 300.1 requires Xcode 26+ and an
    # iOS 18 deployment target, both satisfied by the default toolchain.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The ArcGIS xcframework is ~336 MB unpacked and is fetched through SwiftPM. Resolve it into
      # a fixed directory (rather than inside DerivedData, whose path is randomised) so it can be
      # cached across runs and keyed on the pinned SDK version.
      - name: Cache resolved Swift packages
        uses: actions/cache@v4
        with:
          path: ~/spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('ios/ExpoArcgis.podspec') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install module
        run: npm ci

      # `npm install`, not `npm ci`: the example is a disposable harness whose package.json
      # carries caret ranges, so its lockfile drifts whenever an upstream Expo package ships.
      # `npm ci` would turn somebody else's release into a red build here. The module's own
      # lockfile is still installed strictly above — that one describes the published artifact.
      - name: Install example app
        working-directory: example
        run: npm install --no-audit --no-fund

      - name: Prebuild example (ios)
        working-directory: example
        run: npx expo prebuild -p ios --no-install

      # CocoaPods aborts on a non-UTF-8 locale, which is what the runner defaults to.
      - name: Pod install
        working-directory: example/ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: pod install

      # The ExpoArcgis scheme compiles the module's Swift against ArcGIS + ExpoModulesCore.
      # Simulator only: no signing identity is needed and none is available here.
      - name: Compile module Swift
        working-directory: example/ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          xcodebuild -version
          xcodebuild \
            -workspace expoarcgisexample.xcworkspace \
            -scheme ExpoArcgis \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath ~/spm-cache \
            build
