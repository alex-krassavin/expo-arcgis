name: Docs

# Builds the Astro Starlight site (guides + samples + TypeDoc API references) and deploys it
# to GitHub Pages. Enable Pages with "Source: GitHub Actions" in the repo settings first.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/expo-arcgis/src/**' # the TypeDoc API reference is generated from the core's source
      - 'packages/expo-arcgis-toolkit/src/**' # and the toolkit's from the toolkit's
      - 'example/**' # sample pages embed the example sources
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # Workspace deps + builds: TypeDoc reads the API from packages/expo-arcgis/src and needs the
      # react/react-native types.
      - name: Install + build the packages
        run: npm ci

      - name: Install docs deps
        working-directory: docs
        run: npm ci

      - name: Build docs site
        working-directory: docs
        run: npm run build

      # The site is the root of the custom domain mapforge.dev, for both packages: the build goes
      # out as is, with no base path and no redirect.
      - name: Stage site
        run: |
          rm -rf _site && mkdir -p _site
          cp -a docs/dist/. _site/
          printf 'mapforge.dev\n' > _site/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
