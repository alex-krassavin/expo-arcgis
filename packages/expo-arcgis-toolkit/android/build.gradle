// The ArcGIS Maps SDK for Kotlin Toolkit is Jetpack Compose. Its compiler plugin has to match the
// app's Kotlin, so it is added the way expo-modules-core adds it for its own Compose views.
buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${rootProject.ext.kotlinVersion}")
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.arcgistoolkit'
version = '0.1.0'

// The toolkit is published to Esri's Maven repository, which the core's config plugin already adds
// to the app's repositories.
repositories {
  maven {
    url = uri('https://esri.jfrog.io/artifactory/arcgis')
  }
}

android {
  namespace "expo.modules.arcgistoolkit"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
  lint {
    abortOnError false
  }
}

// The toolkit (like ArcGIS Maps SDK 300.1 itself) is built with Kotlin 2.3. Read its newer metadata
// with the app's older compiler — the same flag as the core's.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  compilerOptions.freeCompilerArgs.add("-Xskip-metadata-version-check")
}

dependencies {
  // The core module: the accessory contract (GeoViewAccessory, GeoViewState), MapRef, the Compose host.
  implementation project(':expo-arcgis')

  // Versions come from the toolkit's bill of materials, released in step with the SDK.
  implementation platform('com.esri:arcgis-maps-kotlin-toolkit-bom:300.1.0')
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-compass'
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-scalebar'
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-basemapgallery'
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-indoors'
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-legend'
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-utilitynetworks'
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-popup'
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-featureforms'
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-offline'
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-authentication'
  // The augmented reality views; it brings ARCore.
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-ar'
  // The core's GeoViewState hands accessories its MapViewProxy.
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-geoview-compose'

  implementation platform('androidx.compose:compose-bom:2026.04.01')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.foundation:foundation'
  // The floor filter's UIProperties carry a Material 3 Typography.
  implementation 'androidx.compose.material3:material3'
}
